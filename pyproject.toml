[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-rag-assistant"
version = "0.1.0"
description = "A local RAG assistant for selected Microsoft Fabric documentation."
requires-python = ">=3.12"
dependencies = [
    "foundry-local-sdk-winml==1.2.4",
    "openai==2.53.0",
    "pypdf==6.17.0",
    "python-docx==1.2.0",
    "streamlit==1.61.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
